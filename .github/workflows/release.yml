name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

# least privilege: jobs that need more ask for it below
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # build provenance (Sigstore OIDC)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-latest,        archive: tar.gz }
          - { target: x86_64-apple-darwin,       os: macos-latest,        archive: tar.gz }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04,     archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest,   archive: zip }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      # no build cache for release artifacts: a poisoned cache must not reach a release
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Stable signature for the macOS binaries: the same identifier and certificate every
      # release, so the designated requirement does not change (README, Upgrading). Runs before
      # packaging, so the checksum and the attestation cover the signed binary. Without the
      # secret (forks) the linker's ad-hoc signature stays, with a visible warning.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          BIN: target/${{ matrix.target }}/release/middleman
        run: |
          set -euo pipefail
          if [ -z "${P12:-}" ] || [ -z "${P12_PASSWORD:-}" ]; then
            echo "::warning title=unsigned macOS build::MACOS_SIGNING_P12 / MACOS_SIGNING_PASSWORD are not set; the binary keeps its ad-hoc signature (see scripts/make-signing-cert.sh)"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          trap 'security delete-keychain "$kc" 2>/dev/null || true; rm -f "$RUNNER_TEMP/signing.p12"' EXIT
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # the certificate's SHA-1 is both the signing identity and the pinned leaf hash
          leaf=$(security find-certificate -a -Z -c "middleman release signing" "$kc" | awk '/SHA-1 hash:/ {print $3; exit}')
          [ -n "$leaf" ] || { echo "signing certificate not found in the p12" >&2; exit 1; }
          req="designated => identifier \"dev.baturox.middleman\" and certificate leaf = H\"$leaf\""
          codesign --force --options runtime --identifier dev.baturox.middleman \
            --sign "$leaf" --keychain "$kc" --timestamp=none -r="$req" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          got=$(codesign -d -r- "$BIN" 2>&1 | sed -n 's/^designated => //p')
          want="identifier \"dev.baturox.middleman\" and certificate leaf = H\"$(echo "$leaf" | tr 'A-F' 'a-f')\""
          echo "designated requirement: $got"
          [ "$(echo "$got" | tr 'A-F' 'a-f')" = "$(echo "$want" | tr 'A-F' 'a-f')" ] ||
            { echo "unexpected designated requirement" >&2; exit 1; }

      - name: Package
        id: pkg
        shell: bash
        run: |
          name="middleman-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/middleman"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          cp "$bin" README.md "dist/$name/"
          cp config/middleman.example.toml config/dictionary.example.txt "dist/$name/"
          [ -f LICENSE ] && cp LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "asset=dist/$asset" >> "$GITHUB_OUTPUT"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums
        run: cd dist && cat *.sha256 > SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: middleman ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
