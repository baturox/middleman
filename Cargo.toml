[package]
name = "middleman"
version = "0.6.1"
edition = "2021"
description = "Privacy-preserving delegation layer: sanitizes and pseudonymizes code before sending small tasks to untrusted LLM providers"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "middleman"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "net", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
regex = "1"
aho-corasick = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
url = "2"
keyring = "4"
dialoguer = "0.12"
console = "0.16"
zeroize = "1"
open = "5"
clap_complete = "4"
toml_edit = "0.22"
getrandom = "0.4"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
assert_cmd = "2"
proptest = "1"

[profile.release]
strip = true
lto = "thin"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(unix)".dev-dependencies]
# drives the real `init` wizard through a pseudo-terminal (tests/init_wizard_pty.rs)
rexpect = "0.7"
