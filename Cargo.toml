[package]
name = "middleman"
version = "0.1.1"
edition = "2021"
description = "Privacy-preserving delegation layer: sanitizes and pseudonymizes code before sending small tasks to untrusted LLM providers"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "middleman"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
regex = "1"
aho-corasick = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
keyring = "4"
dialoguer = "0.12"
zeroize = "1"
open = "5"
clap_complete = "4"
toml_edit = "0.22"
getrandom = "0.4"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
assert_cmd = "2"
proptest = "1"

[profile.release]
strip = true
lto = "thin"
